<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic Meridian - Legal & Policies</title>
  <style>
    :root {
      --primary: #52796f;
      --primary-dark: #354f52;
      --bg: #fafaf9;
      --card: #ffffff;
      --text: #292524;
      --muted: #78716c;
      --border: #e7e5e4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 40px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 540px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.04);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: #f0fdf4;
      border: 1px solid #dcfce7;
      border-radius: 16px;
      margin-bottom: 20px;
      color: var(--primary);
      font-weight: 800;
      font-size: 22px;
    }
    h1 {
      font-size: 24px;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }
    p {
      color: var(--muted);
      font-size: 15px;
      margin-bottom: 32px;
    }
    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn:hover {
      border-color: var(--primary);
      background: #fdfdfd;
      transform: translateY(-1px);
    }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .btn-primary:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }
    footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge">M</div>
    <h1>Agentic Meridian</h1>
    <p>Legal, Privacy & Compliance Documents</p>

    <div class="nav-links">
      <a href="privacy.html" class="btn btn-primary">
        <span>Privacy Policy</span>
        <span>&rarr;</span>
      </a>
      <a href="terms.html" class="btn">
        <span>Terms of Service (EULA)</span>
        <span>&rarr;</span>
      </a>
    </div>

    <footer>
      &copy; 2026 Metric LLC. All rights reserved.
    </footer>
  </div>
</body>
</html>
